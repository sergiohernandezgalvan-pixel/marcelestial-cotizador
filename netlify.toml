[build]
  publish = "public"
  command = "echo 'sitio estatico + funciones'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# La aplicación nunca se guarda en el caché del navegador: cada actualización que se
# publica tiene que llegar al teléfono del vendedor. Los íconos sí se cachean.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
